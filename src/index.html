<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>照片</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #1c1c1c; color: #fff;
    font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif; user-select: none; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage img, #stage video { max-width: 100%; max-height: 100%; object-fit: contain; outline: none; }
  #stage video { width: 100%; height: 100%; background: #000; }

  .bar { position: absolute; left: 0; right: 0; padding: 10px 16px; display: flex; align-items: center; gap: 12px;
    background: linear-gradient(rgba(0,0,0,.65), transparent); transition: opacity .25s; z-index: 5; }
  #top { top: 0; }
  #name { font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #counter { font-size: 13px; opacity: .8; }
  .btn { background: rgba(255,255,255,.1); border: 0; color: #fff; border-radius: 6px; padding: 6px 12px;
    font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: rgba(255,255,255,.2); }
  .btn svg { flex-shrink: 0; }
  .btn-icon { padding: 6px 8px; }

  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 88px; border: 0; z-index: 5;
    background: rgba(0,0,0,.35); color: #fff; font-size: 26px; cursor: pointer; transition: opacity .25s, background .15s; }
  .nav:hover { background: rgba(0,0,0,.65); }
  #prev { left: 8px; border-radius: 8px; }
  #next { right: 8px; border-radius: 8px; }
  .nav[disabled] { visibility: hidden; }

  body.idle .bar, body.idle .nav, body.idle #videoTools { opacity: 0; }
  body.idle { cursor: none; }
  body.empty .bar, body.empty .nav, body.empty #videoTools { opacity: 0; pointer-events: none; }

  #msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; text-align: center; line-height: 1.7; z-index: 3; }
  #msg[hidden] { display: none; }
  #msg .big { font-size: 18px; opacity: .9; }
  #msg .sub { font-size: 13px; opacity: .55; }
  #openMain {
    margin-top: 4px; padding: 12px 36px; font-size: 15px; border: 0; border-radius: 8px;
    background: #2b88d8; color: #fff; cursor: pointer; font: inherit;
  }
  #openMain:hover { background: #3a97e6; }
  #openMain:active { background: #2476bc; }

  #toast { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); background: rgba(40,40,40,.95);
    padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 9; box-shadow: 0 4px 18px rgba(0,0,0,.5); }
  #toast[hidden] { display: none; }

  #videoTools {
    position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%);
    z-index: 6; display: flex; gap: 8px; transition: opacity .25s;
  }
  #videoTools[hidden] { display: none; }
  #playModeBtn { min-width: 132px; justify-content: center; }

  #settingsPanel {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
  }
  #settingsPanel[hidden] { display: none; }
  .settings-card {
    background: #2a2a2a; border-radius: 12px; padding: 20px 24px;
    min-width: 280px; box-shadow: 0 8px 32px rgba(0,0,0,.5);
  }
  .settings-title {
    font-size: 15px; margin-bottom: 16px; opacity: .9;
    display: flex; align-items: center; gap: 8px;
  }
  .settings-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; padding: 10px 0; opacity: .85;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .settings-row:last-of-type { border-bottom: 0; }
  .settings-actions { margin-top: 16px; display: flex; justify-content: flex-end; }
</style>
</head>
<body class="empty">
  <div id="stage"></div>

  <div id="top" class="bar">
    <div id="name"></div>
    <div id="counter"></div>
    <button class="btn" id="openBtn" title="Ctrl+O">打开…</button>
    <button class="btn" id="delBtn" title="Delete">删除</button>
    <button class="btn btn-icon" id="settingsBtn" title="设置" aria-label="设置">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>
  </div>

  <button id="prev" class="nav" title="上一张 (←)">&#10094;</button>
  <button id="next" class="nav" title="下一张 (→)">&#10095;</button>

  <div id="videoTools" hidden>
    <button class="btn" id="playModeBtn" title="点击切换播放模式">
      <svg id="playModeIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"></svg>
      <span id="playModeLabel">默认</span>
    </button>
  </div>

  <div id="msg">
    <div class="big">照片</div>
    <button id="openMain" type="button">打开</button>
    <div class="sub">或按 Ctrl+O 选择图片 / 视频</div>
  </div>
  <div id="toast" hidden></div>

  <div id="settingsPanel" hidden>
    <div class="settings-card" role="dialog" aria-label="设置">
      <div class="settings-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
        设置
      </div>
      <div class="settings-row">
        <span>客户端版本</span>
        <span id="appVersion">—</span>
      </div>
      <div class="settings-actions">
        <button class="btn" id="settingsClose">关闭</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const APP_VERSION = '__APP_VERSION__';

  let files = [], cur = 0, mediaRev = 0;
  const $ = id => document.getElementById(id);
  const stage = $('stage'), nameEl = $('name'), counterEl = $('counter'), msg = $('msg'), toast = $('toast');
  const prevBtn = $('prev'), nextBtn = $('next');
  let toastTimer = null, busy = false, renderSeq = 0;

  const ICONS = {
    default: '<path d="M6 6h12v12H6z"/>',
    loop: '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>',
    auto: '<path d="M4 10h12v2H4v-2zm0-4h12v2H4V6zm0 8h8v2H4v-2zm10 2v-8l7 4-7 4z"/>',
  };

  const PLAY_MODES = [
    { id: 'default', label: '默认', title: '播完停止（当前模式）' },
    { id: 'loop',    label: '单视频循环', title: '单视频循环播放' },
    { id: 'auto',    label: '自动连播', title: '播完自动下一张' },
  ];
  let playMode = 0;

  const api = async (path, method = 'GET') => {
    const r = await fetch(path, { method, cache: 'no-store' });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    return data;
  };
  const setTitle = t => { document.title = t; try { window.ipc.postMessage('title:' + t); } catch (_) {} };
  const say = (text, ms = 3500) => {
    toast.textContent = text; toast.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.hidden = true, ms);
  };
  const apply = s => {
    files = s.files || [];
    cur = files.length ? Math.min(s.current | 0, files.length - 1) : 0;
    mediaRev++;
    render();
  };

  function mediaUrl(i) {
    return 'media/' + i + '?r=' + mediaRev;
  }

  function clearStage() {
    const old = stage.querySelector('video');
    if (old) {
      try { old.pause(); old.removeAttribute('src'); old.load(); } catch (_) {}
    }
    stage.replaceChildren();
  }

  function updatePlayModeBtn() {
    const m = PLAY_MODES[playMode];
    $('playModeLabel').textContent = m.label;
    $('playModeBtn').title = m.title + '（点击切换）';
    $('playModeIcon').innerHTML = ICONS[m.id];
    const v = stage.querySelector('video');
    if (v) v.loop = (m.id === 'loop');
  }

  function cyclePlayMode() {
    playMode = (playMode + 1) % PLAY_MODES.length;
    updatePlayModeBtn();
    say(PLAY_MODES[playMode].label, 1500);
  }

  function render() {
    const seq = ++renderSeq;
    clearStage();
    toast.hidden = true;
    if (!files.length) {
      document.body.classList.add('empty');
      msg.hidden = false; nameEl.textContent = ''; counterEl.textContent = '';
      prevBtn.disabled = nextBtn.disabled = true;
      $('videoTools').hidden = true;
      setTitle('照片'); return;
    }
    document.body.classList.remove('empty');
    msg.hidden = true;
    const f = files[cur];
    if (!f) return;
    const src = mediaUrl(cur);
    let el;
    if (f.kind === 'video') {
      el = document.createElement('video');
      el.controls = true; el.autoplay = true; el.preload = 'auto';
      el.loop = PLAY_MODES[playMode].id === 'loop';
      el.onerror = () => { if (seq === renderSeq) say('无法播放此视频（格式或编码不受系统解码器支持）', 6000); };
      el.addEventListener('ended', () => {
        if (seq !== renderSeq) return;
        const mode = PLAY_MODES[playMode].id;
        if (mode === 'loop') {
          el.currentTime = 0;
          el.play().catch(() => {});
        } else if (mode === 'auto') {
          if (cur < files.length - 1) go(1);
        }
      });
    } else {
      el = document.createElement('img');
      el.draggable = false;
      el.onerror = () => { if (seq === renderSeq) say('无法显示此图片'); };
    }
    el.src = src;
    if (seq !== renderSeq) return;
    stage.appendChild(el);

    nameEl.textContent = f.name;
    counterEl.textContent = (cur + 1) + ' / ' + files.length;
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === files.length - 1;
    setTitle(f.name + ' - 照片');

    $('videoTools').hidden = f.kind !== 'video';
    if (f.kind === 'video') updatePlayModeBtn();

    const nx = files[cur + 1];
    if (nx && nx.kind === 'image') {
      const pre = new Image();
      pre.src = mediaUrl(cur + 1);
    }
  }

  function go(delta) {
    if (!files.length || busy) return;
    const n = Math.min(Math.max(cur + delta, 0), files.length - 1);
    if (n !== cur) { cur = n; render(); }
  }

  async function del() {
    if (!files.length || busy) return;
    busy = true;
    const delIndex = cur;
    const name = files[delIndex].name;

    files.splice(delIndex, 1);
    if (cur >= files.length) cur = Math.max(0, files.length - 1);
    mediaRev++;
    clearStage();
    render();

    try {
      const s = await api('delete?i=' + delIndex, 'POST');
      files = s.files || [];
      cur = files.length ? Math.min(s.current | 0, files.length - 1) : 0;
      mediaRev++;
      render();
      say('已将「' + name + '」移到回收站');
    } catch (e) {
      try { apply(await api('state')); } catch (_) { render(); }
      say(e.message, 5000);
    }
    busy = false;
  }

  async function openDialog() {
    if (busy) return;
    busy = true;
    try { apply(await api('open', 'POST')); } catch (e) { say(e.message); }
    busy = false;
  }

  function togglePlay() {
    const v = stage.querySelector('video');
    if (v) v.paused ? v.play() : v.pause();
  }

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }

  function openSettings() {
    $('appVersion').textContent = APP_VERSION;
    $('settingsPanel').hidden = false;
  }
  function closeSettings() {
    $('settingsPanel').hidden = true;
  }

  addEventListener('keydown', e => {
    if (e.ctrlKey && e.key.toLowerCase() === 'o') { e.preventDefault(); openDialog(); return; }
    if (e.key === 'Escape') {
      if (!$('settingsPanel').hidden) { closeSettings(); e.preventDefault(); return; }
      if (document.fullscreenElement) { document.exitFullscreen(); e.preventDefault(); return; }
      return;
    }
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    switch (e.key) {
      case 'ArrowLeft': case 'PageUp':   go(-1); break;
      case 'ArrowRight': case 'PageDown': go(1); break;
      case 'Home': if (files.length) { cur = 0; render(); } break;
      case 'End':  if (files.length) { cur = files.length - 1; render(); } break;
      case 'Delete': del(); break;
      case ' ': togglePlay(); break;
      case 'f': case 'F': case 'F11': toggleFullscreen(); break;
      default: return;
    }
    e.preventDefault(); e.stopPropagation();
  }, true);

  addEventListener('wheel', e => { if (e.ctrlKey) return; go(e.deltaY > 0 ? 1 : -1); }, { passive: true });
  prevBtn.onclick = () => go(-1);
  nextBtn.onclick = () => go(1);
  $('openBtn').onclick = openDialog;
  $('openMain').onclick = openDialog;
  $('delBtn').onclick = del;
  $('settingsBtn').onclick = openSettings;
  $('settingsClose').onclick = closeSettings;
  $('settingsPanel').onclick = e => { if (e.target === $('settingsPanel')) closeSettings(); };
  $('playModeBtn').onclick = cyclePlayMode;
  stage.addEventListener('dblclick', e => { if (e.target.tagName !== 'VIDEO') toggleFullscreen(); });

  let idleTimer;
  const wake = () => {
    if (document.body.classList.contains('empty')) return;
    document.body.classList.remove('idle'); clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
  };
  addEventListener('mousemove', wake); addEventListener('keydown', wake); wake();

  updatePlayModeBtn();
  api('state').then(apply).catch(e => say(e.message));
})();
</script>
</body>
</html>
