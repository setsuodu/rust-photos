name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: rust-photos

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/x86_64-pc-windows-msvc/release/${BINARY_NAME}.exe"
          STAGE="${BINARY_NAME}-windows-x64"
          mkdir -p dist "${STAGE}"
          cp "${BIN}" "${STAGE}/"
          [ -f README.md ] && cp README.md "${STAGE}/" || true
          [ -f LICENSE ] && cp LICENSE "${STAGE}/" || true
          (
            cd "${STAGE}"
            7z a -tzip "../dist/${STAGE}.zip" .
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-windows-x64
          path: dist/${{ env.BINARY_NAME }}-windows-x64.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-windows-x64
          path: upload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
