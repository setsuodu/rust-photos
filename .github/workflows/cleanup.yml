name: Cleanup

on:
  workflow_dispatch:
    inputs:
      delete_releases:
        description: "Delete all GitHub Releases (including drafts)"
        type: boolean
        default: true
      delete_tags:
        description: "Delete all git tags (remote)"
        type: boolean
        default: true
      delete_workflow_runs:
        description: "Delete all Actions workflow runs"
        type: boolean
        default: true
      keep_latest_runs:
        description: "Keep this many newest workflow runs (0 = delete all)"
        type: number
        default: 0

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    name: Cleanup releases / tags / actions
    runs-on: ubuntu-latest
    steps:
      - name: Delete ALL releases (by ID, kills drafts)
        if: ${{ inputs.delete_releases }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "=== Listing ALL releases (including drafts) by ID ==="
          mapfile -t ids < <(gh api "repos/${{ github.repository }}/releases" --paginate -q '.[].id' || true)

          if [[ ${#ids[@]} -eq 0 ]]; then
            echo "No releases found."
          else
            echo "Found ${#ids[@]} release(s). Deleting..."
            for id in "${ids[@]}"; do
              echo "Deleting release id=$id"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id" || true
            done
            echo "All releases deleted."
          fi

      - name: Delete ALL remaining tags
        if: ${{ inputs.delete_tags }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "=== Listing all tags ==="
          mapfile -t tags < <(gh api "repos/${{ github.repository }}/git/refs/tags" --paginate -q '.[].ref' 2>/dev/null | sed 's#refs/tags/##' || true)

          if [[ ${#tags[@]} -eq 0 ]]; then
            echo "No tags found."
          else
            echo "Found ${#tags[@]} tag(s). Deleting..."
            for tag in "${tags[@]}"; do
              echo "Deleting tag: $tag"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${tag}" || true
            done
            echo "All tags deleted."
          fi

      - name: Delete ALL workflow runs
        if: ${{ inputs.delete_workflow_runs }}
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep_latest_runs }}
        run: |
          set -euo pipefail
          KEEP="${KEEP:-0}"
          echo "=== Listing workflow runs (keep newest: $KEEP) ==="

          mapfile -t runs < <(gh api "repos/${{ github.repository }}/actions/runs?per_page=100" --paginate -q '.workflow_runs[].id' || true)

          total=${#runs[@]}
          echo "Found $total runs"

          if [[ "$total" -eq 0 ]]; then
            echo "No workflow runs."
            exit 0
          fi

          # API returns newest first; skip the first KEEP
          idx=0
          for id in "${runs[@]}"; do
            idx=$((idx + 1))
            if [[ "$idx" -le "$KEEP" ]]; then
              echo "Keep run #$idx id=$id"
              continue
            fi
            echo "Deleting run id=$id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/${id}" || true
          done

          echo "Workflow runs cleanup done."
